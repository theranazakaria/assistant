<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--ink:#12304a;--bg:#f4f7f9;--card:#fff;--line:#d3dde4;--mute:#5a6b79;--teal:#0d7a6b;--tx:#fff;--red:#b3261e;--amb:#b26a00;--soft:#e6f1ef;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6eef5;--bg:#0e1a24;--card:#152634;--line:#2a4358;--mute:#9db0bf;--teal:#3cc0ac;--tx:#0e1a24;--red:#ff8a80;--amb:#f0b44c;--soft:#173229;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{margin:0 0 .6rem;line-height:1.2}h2{font-size:1.15rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 1rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 0 .4rem}
.top h1{font-size:1.4rem;margin:0}.sub{color:var(--mute);font-size:.9rem}
nav{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:.5rem 0 1rem}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .8rem;font:600 .93rem inherit;font-family:inherit;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
:focus-visible{outline:3px solid #f0b44c;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.7rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.55rem .6rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:4rem}
.btn{background:var(--teal);color:var(--tx);border:0;border-radius:7px;padding:.55rem .95rem;font:600 .92rem inherit;font-family:inherit;cursor:pointer}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:.28rem .6rem;font-size:.82rem}

.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem}.stat b{font-size:1.6rem;display:block}.stat span{color:var(--mute);font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;color:var(--mute)}
.tag{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft)}
.od{color:var(--red);font-weight:600}.hi{color:var(--amb);font-weight:600}.note{color:var(--mute);font-size:.88rem}.empty{color:var(--mute)}
.chip{display:inline-block;background:var(--soft);border-radius:8px;padding:.3rem .55rem;margin:.15rem .3rem .15rem 0;font-size:.88rem;vertical-align:top}.ttb th,.ttb td{border:1px solid var(--line);min-width:8.5rem;vertical-align:top}.ttb td.tm{font-weight:700;white-space:nowrap;background:var(--soft);min-width:6.5rem}.ttb .chip{display:block;margin:.2rem 0}.free{background:#e7f6ec;color:#14532d;border-radius:8px;padding:.25rem .55rem;margin:.15rem .3rem .15rem 0;display:inline-block;font-weight:600;font-size:.9rem}@media(prefers-color-scheme:dark){.free{background:#14352a;color:#9be7b9}}.ts3{display:flex;gap:.3rem}.ts3 select{width:auto;flex:1}.bn{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + .5rem);background:var(--ink);color:var(--bg);padding:.4rem .5rem .4rem .9rem;border-radius:99px;z-index:20;font-size:.9rem;display:flex;gap:.6rem;align-items:center}.bn[hidden]{display:none}button.stat{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;transition:transform .12s,box-shadow .12s}button.stat:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(18,48,74,.55)}.stat i{font-style:normal;opacity:.5}
.gh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}@media(max-width:760px){.gh{grid-template-columns:1fr}}
.lk{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk:hover{color:var(--teal)}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}.pc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.7rem;display:flex;gap:.8rem;align-items:center;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}.pc:hover{border-color:var(--teal)}.pc b{display:block}
.hero .btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}.hb{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.ttb .ttl{font-size:1.5rem;font-style:italic;text-align:center;background:var(--card);color:var(--ink)}.ttb .ttn{background:#1f4e79;color:#fff;text-align:center}.ttb .ttn2{background:#2f5f8f;color:#fff;text-align:center;font-weight:600}.ttb td.emp{cursor:pointer}.ttb td.emp:hover{background:var(--soft)}
@media print{.ttb .ttn,.ttb .ttn2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.chk label{display:inline-flex;align-items:center;gap:.3rem;font-weight:500;margin:0 .8rem .3rem 0}.chk input{width:auto}
.err{color:var(--red);margin:.5rem 0}
.login{max-width:22rem;margin:12vh auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:1rem}.ov img{max-width:100%;max-height:90vh;border-radius:8px}
.tk{border:1px solid var(--line);border-radius:8px;padding:.8rem;margin-bottom:.7rem}

.hero{background:linear-gradient(135deg,#0d7a6b,#12304a);color:#fff;border-radius:14px;padding:1.2rem 1.4rem;margin:.4rem 0 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.hero h2{font-size:1.4rem;margin:0}.hero p{margin:.2rem 0 0;opacity:.85;font-size:.92rem}
.hero .pill{background:rgba(255,255,255,.16);border-radius:99px;padding:.3rem .8rem;font-size:.85rem;font-weight:600}
.card{box-shadow:0 1px 3px rgba(18,48,74,.08)}
.stat{border-left:4px solid var(--c,#0d7a6b)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:1rem}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
.dn{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.dn .c{position:relative;width:170px;height:170px}.dn .c b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem}.dn .c span{font-size:.75rem;color:var(--mute);font-weight:400}
.lg{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.82rem;color:var(--mute)}.lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.br{display:grid;grid-template-columns:8rem 1fr 3rem;align-items:center;gap:.6rem;margin:.55rem 0;font-size:.9rem}
.br .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .bp{text-align:right;font-weight:600}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}.bar span{display:block;height:100%}
.me{font-weight:700;color:var(--teal)}
@media(max-width:520px){.br{grid-template-columns:5.5rem 1fr 2.6rem}}
#pa{display:none}
@media print{body>.wrap,.ov{display:none!important}#pa{display:block;padding:1rem;color:#000;background:#fff}#pa table{font-size:11px}#pa th,#pa td{border:1px solid #999}}
</style></head><body>
<div id="bn" class="bn" hidden role="status">New updates are available. <button class="btn s" data-a="refresh">Refresh now</button></div><div class="wrap" id="app"></div><div id="pa"></div>
<script>
(function(){
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ST=["Pending","In progress","Done"];
var me=null,tab="",ed=null,ttf=null,fr=null,TU=[],TT=[],AU=[],P=[],PT=[],TY=[],TR=[],tf="all",sel=0,pd=null,V=0,dirty=false,stale=false,U=[],T=[],A=[],L=[],M=[],pend={},msg="",rep="tasks",$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function today(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function fmt(s){if(!s)return"";var d=new Date(s+"T00:00:00");return DAYS[d.getDay()]+" "+d.getDate()+" "+d.toLocaleString("en",{month:"short"})+" "+d.getFullYear()}
function ndays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)+1}
function adm(){return me&&(me.role==="admin"||me.role==="superadmin")}
function stf(){return U.filter(function(u){return u.active&&u.role==="staff"})}
function ppl(){return U.filter(function(u){return u.active&&(u.role==="staff"||u.role==="tutor")})}
function tutl(){var ids=TU.map(function(t){return t.user_id});return U.filter(function(u){return u.active&&(u.role==="tutor"||ids.indexOf(u.id)>=0)})}
function allp(){var m={},o=[];P.concat(PT).forEach(function(r){if(!m[r.id]){m[r.id]=1;o.push(r)}});return o.sort(function(a,b){return a.name<b.name?-1:1})}
function t12(s){if(!s)return"";var p=String(s).split(":"),h=+p[0],ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+p[1]+" "+ap}
function tsel(id,v){var p=(v||"08:00").split(":"),h=+p[0],ap=h>=12?"PM":"AM",hh=h%12||12,o="",m="",i;for(i=1;i<=12;i++)o+="<option"+(i===hh?" selected":"")+">"+i+"</option>";for(i=0;i<60;i+=5){var mm=("0"+i).slice(-2);m+="<option"+(mm===p[1]?" selected":"")+">"+mm+"</option>"}return'<span class="ts3"><select id="'+id+'h" aria-label="Hour">'+o+'</select><select id="'+id+'m" aria-label="Minutes">'+m+'</select><select id="'+id+'a" aria-label="AM or PM"><option'+(ap==="AM"?" selected":"")+'>AM</option><option'+(ap==="PM"?" selected":"")+'>PM</option></select></span>'}
function gt(id){var h=+val(id+"h"),ap=val(id+"a");if(ap==="AM"&&h===12)h=0;else if(ap==="PM"&&h<12)h+=12;return("0"+h).slice(-2)+":"+val(id+"m")}
var PER={morning:[["08:00","08:45"],["08:45","09:30"],["09:30","10:15"],["10:15","11:00"],["11:00","11:45"],["11:45","12:30"],["12:30","13:15"],["13:15","14:00"]],evening:[["12:00","12:45"],["12:45","13:30"],["13:30","14:15"],["14:15","15:00"],["15:00","15:45"],["15:45","16:30"],["16:30","17:15"],["17:15","18:00"]]};
function shiftOf(x){return x.shift||(x.t_from>="12:00"?"evening":"morning")}
function onLeave(id,d){return L.some(function(l){return l.user_id===id&&l.status==="Approved"&&l.from_d<=d&&d<=l.to_d})}
function avail(u,d){if(!d)return true;var w=new Date(d+"T00:00:00").getDay();return String(u.days).split(",").indexOf(String(w))>=0&&!onLeave(u.id,d)}
function api(a,d){var o=Object.assign({a:a},d||{});return fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.json().catch(function(){return{e:"Server error."}}).then(function(j){if(!r.ok){if(r.status===401&&a!=="login"&&a!=="me"){me=null;draw()}throw new Error(j.e||"Error")}return j})})}
function load(){var p=[api("tasks.list"),api("leave.list"),api("progress"),api("tutors.list"),api("tt.list"),api("ping")];if(adm())p.push(api("users.list"),api("mis.list"),api("audit.list"));return Promise.all(p).then(function(r){T=r[0].tasks;A=r[0].as;L=r[1].leaves;P=r[2].rows;PT=r[2].trows;TY=r[2].types;TR=r[2].trend;TU=r[3].tutors;TT=r[4].tt;V=r[5].v;if(adm()){U=r[6].users;M=r[7].mis;AU=r[8].audit}})}
function act(p,ok){msg="";return p.then(function(){return load()}).then(function(){if(ok)ok();draw()}).catch(function(e){msg=e.message;draw()})}
function tabs(){return adm()?[["dash","Dashboard"],["prog","Team progress"],["tasks","Tasks"],["people","Staff & accounts"],["tut","Tutors"],["tt","Timetable"],["leave","Leave"],["mis","Misconduct"],["rep","Reports"],["act","Activity log"]]:[["team","Dashboard"],["prog","Team progress"],["mine","My tasks"],["tt","Timetable & tutor"],["leave","My leave"],["prof","Profile"]]}

function draw(){
var a=$("app");dirty=false;stale=false;$("bn").hidden=true;
if(!me){a.innerHTML='<div class="card login"><h1>CIT Office Desk</h1><p class="sub">Government College of Technology, Kamalia</p><label for="lu">Username</label><input id="lu" autocomplete="username"><label for="lp" style="margin-top:.6rem">Password</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="le">'+esc(msg)+'</div><button class="btn" data-a="login">Sign in</button></div>';return}
if(!tab||(tab!=="person"&&!tabs().some(function(t){return t[0]===tab})))tab=tabs()[0][0];
var h='<div class="top"><div><h1>CIT Office Desk</h1><div class="sub">'+esc(me.name)+' · '+({staff:"Staff",tutor:"Class tutor",admin:"Admin (HOD)",superadmin:"Super admin"})[me.role]+'</div></div><button class="btn g s" data-a="logout">Sign out</button></div><nav>'+tabs().map(function(t){return'<button data-a="tab" data-v="'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join("")+'</nav>';
if(msg)h+='<div class="err" role="alert">'+esc(msg)+'</div>';
h+=({dash:vDash,team:vTeam,prog:vProg,person:vPerson,tasks:vTasks,people:vPeople,tut:vTut,tt:vTT,act:vAct,prof:vProf,leave:vLeave,mis:vMis,rep:vRep,mine:vMine})[tab]();
a.innerHTML=h;if(tab==="tasks")boxes()}

var COL={d:"#0d7a6b",o:"#3b82f6",l:"#dc2626"};
function sum(rows){var d=0,l=0,t=0;rows.forEach(function(r){d+=r.done;l+=r.late;t+=r.total});return{d:d,l:l,o:t-d-l,t:t}}
function pct(s){return s.t?Math.round(s.d/s.t*100):0}
function donut(s){var tot=s.t||1,off=25,g='<svg viewBox="0 0 42 42" width="170" height="170" role="img" aria-label="Completion chart"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="5"/>';[[s.d,COL.d],[s.o,COL.o],[s.l,COL.l]].forEach(function(x){if(!x[0])return;var n=x[0]/tot*100;g+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+x[1]+'" stroke-width="5" stroke-dasharray="'+n+' '+(100-n)+'" stroke-dashoffset="'+off+'"/>';off-=n});return'<div class="dn"><div class="c">'+g+'</svg><b>'+pct(s)+'%<span>completed</span></b></div>'+legend(s)+'</div>'}
function legend(s){return'<div class="lg"><span><i style="background:'+COL.d+'"></i>Done '+s.d+'</span><span><i style="background:'+COL.o+'"></i>Open '+s.o+'</span><span><i style="background:'+COL.l+'"></i>Overdue '+s.l+'</span></div>'}
function bars(rows){if(!rows.length)return'<p class="empty">Nothing to show yet.</p>';return rows.map(function(r){var o=r.total-r.done-r.late,w=function(n){return r.total?n/r.total*100:0},p=r.total?Math.round(r.done/r.total*100):0,nm=esc(r.name),lab=r.id?'<button class="lk'+(me&&r.id===me.id?" me":"")+'" data-a="person" data-v="'+r.id+'" title="See progress of '+nm+'">'+nm+'</button>':'<span class="bn" title="'+nm+'">'+nm+'</span>';
return'<div class="br">'+lab+'<div class="bar" role="img" aria-label="'+nm+': '+r.done+' of '+r.total+' done">'+(r.total?'<span style="width:'+w(r.done)+'%;background:'+COL.d+'"></span><span style="width:'+w(o)+'%;background:'+COL.o+'"></span><span style="width:'+w(r.late)+'%;background:'+COL.l+'"></span>':"")+'</div><span class="bp">'+(r.total?p+"%":"-")+'</span></div>'}).join("")}
function soon(list){var td=today(),e=new Date();e.setDate(e.getDate()+7);var lim=e.getFullYear()+"-"+("0"+(e.getMonth()+1)).slice(-2)+"-"+("0"+e.getDate()).slice(-2);var r=list.filter(function(x){var t=tk(x.task_id);return x.status!=="Done"&&t&&t.due<=lim}).sort(function(a,b){return tk(a.task_id).due<tk(b.task_id).due?-1:1});return r.length?'<div class="tw"><table><tr><th>Task</th>'+(adm()?'<th>Staff</th>':'')+'<th>Deadline</th></tr>'+r.slice(0,8).map(function(x){var t=tk(x.task_id);return'<tr><td>'+esc(t.title)+'</td>'+(adm()?'<td>'+esc(x.name)+'</td>':'')+'<td class="'+(t.due<td?"od":"")+'">'+fmt(t.due)+(t.due<td?" (overdue)":"")+'</td></tr>'}).join("")+'</table></div>':'<p class="empty">Nothing due in the next 7 days.</p>'}
function hero(t,x){return'<div class="hero"><div><h2>'+t+'</h2><p>CIT Department · Government College of Technology, Kamalia</p></div><div class="hb">'+(x||"")+'<span class="pill">'+fmt(today())+'</span></div></div>'}
function go(t,f){tab=t;if(f)tf=f;ed=null;msg="";draw();scrollTo(0,0)}
function kpi(n,l,c,t,f){return'<button class="stat" style="--c:'+c+'" data-a="go" data-v="'+t+'"'+(f?' data-t="'+f+'"':"")+'><b>'+n+'</b><span>'+l+' <i aria-hidden="true">›</i></span></button>'}
function stat(n,l,c){return'<div class="stat" style="--c:'+c+'"><b>'+n+'</b><span>'+l+'</span></div>'}
function sd(s){var d=new Date(s+"T00:00:00");return d.getDate()+" "+d.toLocaleString("en",{month:"short"})}
function asum(list){var td=today(),d=0,l=0,o=0;list.forEach(function(x){var t=tk(x.task_id);if(x.status==="Done")d++;else if(t&&t.due<td)l++;else o++});return{d:d,l:l,o:o,t:d+l+o}}
function ring(p,sz,col){return'<svg viewBox="0 0 42 42" width="'+sz+'" height="'+sz+'" aria-hidden="true"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+(col||COL.d)+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="25"/><text x="21" y="24.5" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">'+p+'%</text></svg>'}
function colChart(lb,vals,col){var mx=Math.max.apply(null,vals.concat([1])),W=320,H=130,bw=W/vals.length,g='<svg viewBox="0 0 '+W+' '+(H+24)+'" width="100%" role="img" aria-label="Column chart">';vals.forEach(function(v,i){var ht=v/mx*H,x=i*bw+bw/2;g+='<rect x="'+(i*bw+6)+'" y="'+(H-ht)+'" width="'+(bw-12)+'" height="'+ht+'" rx="4" fill="'+col+'"/><text x="'+x+'" y="'+(H-ht-4)+'" text-anchor="middle" font-size="10" fill="currentColor">'+(v||"")+'</text><text x="'+x+'" y="'+(H+15)+'" text-anchor="middle" font-size="9" fill="var(--mute)">'+esc(lb[i])+'</text>'});return g+'</svg>'}
